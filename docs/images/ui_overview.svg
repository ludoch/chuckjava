<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Background -->
  <rect x="0" y="0" width="800" height="600" rx="10" fill="#1a1a1a" stroke="#444" stroke-width="2"/>

  <!-- TOP SECTION: Transport and Global Controls -->
  <rect x="20" y="20" width="760" height="120" rx="5" fill="#2b2b2b" stroke="#3d3d3d"/>
  
  <!-- Mode Toggles -->
  <text x="30" y="45" fill="#aaa" font-family="sans-serif" font-size="10">VIEW MODE</text>
  <rect x="30" y="55" width="40" height="25" rx="3" fill="#444" stroke="#666"/>
  <text x="50" y="72" fill="white" font-family="sans-serif" font-size="9" text-anchor="middle">CLIP</text>
  <rect x="75" y="55" width="40" height="25" rx="3" fill="#222" stroke="#444"/>
  <text x="95" y="72" fill="#888" font-family="sans-serif" font-size="9" text-anchor="middle">SONG</text>
  <rect x="120" y="55" width="40" height="25" rx="3" fill="#222" stroke="#444"/>
  <text x="140" y="72" fill="#888" font-family="sans-serif" font-size="9" text-anchor="middle">ARR</text>

  <!-- Transport -->
  <rect x="180" y="55" width="70" height="30" rx="3" fill="#2e7d32"/>
  <text x="215" y="75" fill="white" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">▶ PLAY</text>
  <rect x="255" y="55" width="70" height="30" rx="3" fill="#c62828"/>
  <text x="290" y="75" fill="white" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">■ STOP</text>

  <!-- Sliders Row -->
  <g transform="translate(340, 40)">
    <text x="0" y="5" fill="#e0e0e0" font-family="sans-serif" font-size="9">TEMPO</text>
    <rect x="0" y="10" width="100" height="4" rx="2" fill="#111"/>
    <rect x="40" y="5" width="6" height="14" rx="1" fill="#888"/>
    
    <text x="115" y="5" fill="#e0e0e0" font-family="sans-serif" font-size="9">SWING</text>
    <rect x="115" y="10" width="100" height="4" rx="2" fill="#111"/>
    <rect x="160" y="5" width="6" height="14" rx="1" fill="#888"/>
    
    <text x="230" y="5" fill="#e0e0e0" font-family="sans-serif" font-size="9">MASTER VOL</text>
    <rect x="230" y="10" width="100" height="4" rx="2" fill="#111"/>
    <rect x="290" y="5" width="6" height="14" rx="1" fill="#888"/>
  </g>

  <!-- File/Debug Buttons -->
  <rect x="340" y="90" width="80" height="25" rx="3" fill="#555"/>
  <text x="380" y="107" fill="white" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">📂 LOAD XML</text>
  <rect x="430" y="90" width="60" height="25" rx="3" fill="#555"/>
  <text x="460" y="107" fill="white" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">🐞 BUG</text>

  <!-- MATRIX SECTION -->
  <rect x="20" y="150" width="760" height="390" rx="5" fill="#111" stroke="#3d3d3d"/>
  
  <!-- Grid Labels and Audition Pads -->
  <g transform="translate(30, 170)">
    <!-- Loop for rows -->
    <rect x="0" y="0" width="20" height="20" rx="3" fill="#444"/> <!-- Pad 1 -->
    <text x="30" y="15" fill="#ccc" font-family="sans-serif" font-size="10">KICK</text>
    <text x="75" y="15" fill="#888" font-family="sans-serif" font-size="12">⚙</text>

    <rect x="0" y="45" width="20" height="20" rx="3" fill="#444"/> <!-- Pad 2 -->
    <text x="30" y="60" fill="#ccc" font-family="sans-serif" font-size="10">SNARE</text>
    
    <rect x="0" y="90" width="20" height="20" rx="3" fill="#444"/> <!-- Pad 3 -->
    <text x="30" y="105" fill="#ccc" font-family="sans-serif" font-size="10">HIHAT</text>

    <!-- Synthetic Tracks with colors -->
    <rect x="0" y="180" width="20" height="20" rx="3" fill="#55FF55"/> 
    <text x="30" y="195" fill="#ccc" font-family="sans-serif" font-size="10">SYNTH 1</text>
  </g>

  <!-- The Steps Grid (8 rows x 16 columns) -->
  <g transform="translate(130, 165)">
    <!-- Column markings for every 4 steps -->
    <rect x="145" y="0" width="4" height="360" fill="#222"/>
    <rect x="295" y="0" width="4" height="360" fill="#222"/>
    <rect x="445" y="0" width="4" height="360" fill="#222"/>

    <!-- Row 1: Kick cells -->
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#FF5555"/> <!-- Active -->
    <rect x="35" y="0" width="30" height="30" rx="4" fill="#333"/>
    <rect x="70" y="0" width="30" height="30" rx="4" fill="#333"/>
    <rect x="105" y="0" width="30" height="30" rx="4" fill="#333"/>
    
    <rect x="155" y="0" width="30" height="30" rx="4" fill="#FF5555"/>
    <rect x="190" y="0" width="30" height="30" rx="4" fill="#333"/>
    <rect x="225" y="0" width="30" height="30" rx="4" fill="#333"/>
    <rect x="260" y="0" width="30" height="30" rx="4" fill="#333"/>

    <!-- Playhead Indicator (White outline on col 1) -->
    <rect x="0" y="0" width="30" height="360" fill="white" opacity="0.1"/>
    <rect x="0" y="0" width="30" height="30" rx="4" fill="none" stroke="white" stroke-width="2"/>

    <!-- Generic grid pattern for remaining space -->
    <rect x="0" y="45" width="600" height="1" fill="#222"/>
    <rect x="0" y="90" width="600" height="1" fill="#222"/>
    <rect x="0" y="135" width="600" height="1" fill="#222"/>
    <rect x="0" y="180" width="600" height="1" fill="#222"/>
    <rect x="0" y="225" width="600" height="1" fill="#222"/>
    <rect x="0" y="270" width="600" height="1" fill="#222"/>
    <rect x="0" y="315" width="600" height="1" fill="#222"/>
  </g>

  <!-- BOTTOM SECTION: Status Bar -->
  <rect x="20" y="550" width="760" height="30" rx="5" fill="#222" stroke="#333"/>
  <text x="40" y="570" fill="#00FF00" font-family="monospace" font-size="12">STEP: 0 | BPM: 120.0 | SWING: 50% | OK</text>
</svg>
