name: Build and Release Deluge

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank to auto-bump minor version from latest)'
        required: false
        default: ''

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine Tag Name
      id: get_tag
      run: |
        if [ -n "${{ github.event.inputs.tag_name }}" ]; then
          echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
        else
          LATEST_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "TAG_NAME=v1.1.0" >> $GITHUB_ENV
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            echo "TAG_NAME=v${MAJOR}.${NEW_MINOR}.0" >> $GITHUB_ENV
          fi
        fi


    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        server-id: github

    - name: Build Linux fat jar
      run: mvn -pl deluge -am clean package -DskipTests -nsu -Djavafx.platform=linux
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Store Linux fat jar
      run: cp deluge/target/deluge-1.0-SNAPSHOT.jar deluge-linux.jar

    - name: Build macOS Intel fat jar
      run: mvn -pl deluge -am clean package -DskipTests -nsu -Djavafx.platform=mac
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Store macOS Intel fat jar
      run: cp deluge/target/deluge-1.0-SNAPSHOT.jar deluge-mac-x64.jar

    - name: Build macOS ARM fat jar
      run: mvn -pl deluge -am clean package -DskipTests -nsu -Djavafx.platform=mac-aarch64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Store macOS ARM fat jar
      run: cp deluge/target/deluge-1.0-SNAPSHOT.jar deluge-mac-aarch64.jar

    - name: Build Windows fat jar
      run: mvn -pl deluge -am clean package -DskipTests -nsu -Djavafx.platform=win
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Store Windows fat jar
      run: cp deluge/target/deluge-1.0-SNAPSHOT.jar deluge-win.jar

    - name: Prepare Release Assets
      run: |
        mkdir -p release_assets
        cp deluge-linux.jar release_assets/
        cp deluge-mac-x64.jar release_assets/
        cp deluge-mac-aarch64.jar release_assets/
        cp deluge-win.jar release_assets/
        cp deluge/run.sh release_assets/
        cp deluge/run.bat release_assets/
        chmod +x release_assets/run.sh
        cd release_assets && zip -r ../deluge-workstation.zip ./*

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Deluge Workstation Release ${{ env.TAG_NAME }}
        draft: false
        prerelease: false
        files: |
          deluge-workstation.zip
          release_assets/deluge-linux.jar
          release_assets/deluge-mac-x64.jar
          release_assets/deluge-mac-aarch64.jar
          release_assets/deluge-win.jar
          release_assets/run.sh
          release_assets/run.bat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
