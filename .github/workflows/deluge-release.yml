name: Build and Release Deluge

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn -pl deluge -am clean package -DskipTests -nsu

    - name: Prepare Release Assets
      run: |
        mkdir -p release_assets
        cp deluge/target/deluge-1.0-SNAPSHOT.jar release_assets/
        cp deluge/run.sh release_assets/
        cp deluge/run.bat release_assets/
        chmod +x release_assets/run.sh
        cd release_assets && zip -r ../deluge-workstation.zip ./*

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: Deluge Workstation Release ${{ github.event.inputs.tag_name }}
        draft: false
        prerelease: false
        files: |
          deluge-workstation.zip
          release_assets/deluge-1.0-SNAPSHOT.jar
          release_assets/run.sh
          release_assets/run.bat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
